name: Build ImmortalWrt-25.12 for armsr_armv8

on:
  workflow_dispatch:
    inputs:
      fw_version:
        description: "固件版本号（留空则自动取上游 25.12 系列最新稳定版）"
        required: false
        default: ""
  schedule:
    - cron: "0 0 1,16 * *"

env:
  FW_VERSION: ${{ github.event.inputs.fw_version }}
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-25.12
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-26.04

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Initialize environment
      run: |
        sudo env DEBIAN_FRONTEND=noninteractive apt-get -qq update > /dev/null
        sudo env DEBIAN_FRONTEND=noninteractive apt-get -qq install -y \
          ack antlr3 asciidoc autoconf automake autopoint \
          binutils bison build-essential bzip2 \
          ccache clang cmake cpio curl \
          device-tree-compiler ecj fastjar flex gawk gettext \
          gcc-multilib g++-multilib git gnutls-dev \
          gperf haveged help2man intltool \
          lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev \
          libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev \
          libncurses-dev libpython3-dev libreadline-dev \
          libssl-dev libtool libyaml-dev libz-dev \
          lld llvm lrzsz mkisofs msmtp nano \
          ninja-build p7zip p7zip-full patch pkgconf \
          python3 python3-pip python3-ply python3-docutils python3-pyelftools \
          qemu-utils re2c rsync scons squashfs-tools \
          subversion swig texinfo uglifyjs upx-ucl \
          unzip vim wget xmlto xxd zlib1g-dev zstd \
          nodejs cssmin \
          > /dev/null
        sudo env DEBIAN_FRONTEND=noninteractive apt-get -qq autoremove --purge > /dev/null
        sudo apt-get -qq clean > /dev/null
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown "$USER:$GROUPS" /workdir

    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                    /usr/local/share/boost /opt/hostedtoolcache/CodeQL
        df -h /

    - name: Clone source code
      working-directory: /workdir
      run: |
        git clone $REPO_URL -b $REPO_BRANCH --single-branch --depth=1 openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt
        echo "FILE_DATE=$(date +"%Y%m%d")" >> $GITHUB_ENV
        if [ -z "$FW_VERSION" ]; then
          fw="$(git ls-remote --tags $REPO_URL 'v25.12.*' '25.12.*' 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+$' | sort -uV | tail -n1 || true)"
          [ -n "$fw" ] || fw="25.12"
          echo "FW_VERSION=$fw" >> $GITHUB_ENV
          echo "FW_VERSION(auto)=$fw"
        else
          echo "FW_VERSION(manual)=$FW_VERSION"
        fi

    - name: Prepare & Install feeds
      working-directory: ./openwrt
      run: |
        bash $GITHUB_WORKSPACE/armsr/armv8/diy/diy.sh
        ./scripts/feeds install -a

    - name: Load N1 custom config
      run: |
        rm -rf openwrt/.config
        mkdir -p openwrt/files
        if [ -d armsr/armv8/N1/files ]; then
          cp -a armsr/armv8/N1/files/. openwrt/files/
        fi
        mv armsr/armv8/N1/.config openwrt/.config
        chmod -R 755 openwrt

    - name: Download package
      working-directory: ./openwrt
      run: |
        make defconfig
        grep -E '^CONFIG_(TARGET_OPTIONS|TARGET_OPTIMIZATION)=' .config || true
        make download -j$(( $(nproc) * 2 ))

    - name: Compile N1 firmware
      working-directory: ./openwrt
      run: |
        make -j$(( $(nproc) + 1 )) || make -j1 V=s

    - name: Verify ophub script patches in rootfs
      working-directory: ./openwrt
      run: |
        # diy.sh 对 ophub 插件脚本的补丁曾出现过"日志成功但镜像未生效"的漂移，
        # 此步骤在发布前强制验证，失败即终止，防止带着旧脚本发布
        tgz=$(ls bin/targets/armsr/armv8/*rootfs.tar.gz)
        echo "检查 $tgz"
        if tar -xOzf "$tgz" ./usr/sbin/openwrt-update-amlogic | grep -q 'ln -sf /mnt/${EMMC_NAME}${PARTITION_NAME}4/AdGuardHome'; then
          echo "FAIL: openwrt-update-amlogic 仍含 AGH 迁移块"
          exit 1
        fi
        for p in './etc/adguardhome/' './etc/mosdns/rule/' './usr/share/nlbwmon/'; do
          tar -xOzf "$tgz" ./usr/sbin/openwrt-backup | grep -qF "$p" || { echo "FAIL: openwrt-backup 缺少备份清单条目 $p"; exit 1; }
        done
        echo "OK: ophub 脚本补丁已生效"

    - name: Verify firmware version and tuning files
      run: |
        # 纯信息展示步骤：关闭 errexit/pipefail，任何异常只打印 WARN，绝不阻断发布
        set +e
        set +o pipefail
        rootfs="$(ls openwrt/bin/targets/armsr/armv8/*rootfs.tar.gz 2>/dev/null | head -n1)"
        if [ -z "$rootfs" ]; then
          echo "WARN: 未找到 rootfs.tar.gz，跳过校验"
          exit 0
        fi
        members="$(mktemp)"
        if ! tar -tzf "$rootfs" > "$members" 2>/dev/null; then
          echo "WARN: rootfs tar 读取失败，跳过校验"
          rm -f "$members"
          exit 0
        fi

        member="$(grep -E '(^|/)etc/openwrt_release$' "$members" | head -n1)"
        if [ -n "$member" ]; then
          echo "读取 ${rootfs} 中的 ${member}:"
          tar -xOzf "$rootfs" "$member" > /tmp/openwrt_release 2>/dev/null
          cat /tmp/openwrt_release 2>/dev/null
          if grep -q "DISTRIB_RELEASE='${FW_VERSION}'" /tmp/openwrt_release 2>/dev/null; then
            echo "OK: 固件版本号已生效 -> ${FW_VERSION}"
          else
            echo "WARN: 期望版本号 ${FW_VERSION} 未生效，实际版本见上方 openwrt_release"
          fi
        else
          echo "WARN: rootfs 里找不到 etc/openwrt_release，跳过版本号检查"
        fi

        missing=0
        for f in \
          etc/sysctl.d/20-network-tuning.conf \
          etc/sysctl.d/99-zram.conf \
          etc/hotplug.d/net/01-maximize_nic_rx_tx_buffers \
          etc/apk/keys/nikki.pem etc/apk/keys/momo.pem \
          etc/apk/keys/openwrt-passwall-build.pem \
          etc/uci-defaults/99-custom-feeds \
          etc/uci-defaults/99-adguardhome-paths \
          etc/uci-defaults/99-distfeeds-video \
          etc/uci-defaults/99-openssh-sshd-user \
          etc/uci-defaults/99-firewall-flow-offload \
          etc/uci-defaults/99-hold-core-packages \
          etc/uci-defaults/99-luci-lang \
          etc/uci-defaults/99-mosdns-tuning \
          etc/uci-defaults/99-zram-size \
          etc/rc.d/S96-rps-4cpu \
          etc/ssh/sshd_config \
          etc/ssh/ssh_config \
          etc/uci-defaults/99-mitigations-off \
          usr/bin/mosdns usr/bin/openlist2 usr/bin/ddnstox \
          usr/bin/AdGuardHome etc/config/AdGuardHome etc/init.d/AdGuardHome \
          usr/bin/xray usr/bin/sing-box \
          usr/bin/tcping usr/bin/geoview usr/bin/geo2txt \
          usr/bin/wg usr/bin/wg-quick etc/modules.d/wireguard \
          etc/config/ddns etc/init.d/ddns usr/lib/ddns/dynamic_dns_updater.sh \
          usr/share/ddns/default/cloudflare.com-v4.json usr/lib/ddns/update_cloudflare_com_v4.sh \
          usr/libexec/mihomo \
          usr/share/v2ray/geoip.dat usr/share/v2ray/geosite.dat \
          etc/config/mosdns etc/config/openlist2 etc/config/ddnstox \
          etc/init.d/passwall2 \
          etc/init.d/nikki etc/init.d/momo \
          usr/sbin/sshd bin/bash; do
          grep -qE "(^|/)${f}$" "$members" || { echo "MISSING: ${f}"; missing=$((missing + 1)); }
        done

        if [ "$missing" -eq 0 ]; then
          echo "OK: 运行时优化文件与核心组件均已打进镜像"
        else
          echo "WARN: 有 ${missing} 个文件未打进镜像，详见上方 MISSING 列表（不影响发布）"
        fi

        # AdGuardHome 核心版本断言
        agh_bin="$(grep -E '(^|/)usr/bin/AdGuardHome$' "$members" | head -n1)"
        if [ -n "$agh_bin" ]; then
          tar -xOzf "$rootfs" "$agh_bin" > /tmp/agh_bin 2>/dev/null
          agh_got="$(strings /tmp/agh_bin 2>/dev/null | grep -oE 'v?0\.1[0-9]{2}\.[0-9]+' | head -n1)"
          agh_got="${agh_got#v}"
          rm -f /tmp/agh_bin
          if [ -n "$AGH_VERSION" ] && [ -n "$agh_got" ] && [ "$agh_got" != "$AGH_VERSION" ]; then
            echo "WARN: AdGuardHome 版本不符：镜像 ${agh_got} / 期望 ${AGH_VERSION}"
          elif [ -n "$agh_got" ]; then
            echo "OK: AdGuardHome 核心版本 ${agh_got}"
          fi
        fi
        rm -f "$members"
        exit 0

    - name: Package N1 firmware
      uses: ophub/amlogic-s9xxx-openwrt@main
      with:
        openwrt_path: openwrt/bin/targets/armsr/armv8/*rootfs.tar.gz
        openwrt_board: s905d
        kernel_usage: flippy
        openwrt_kernel: 6.12.y
        openwrt_size: 256/1280
        builder_name: anonymous

    - name: Upload firmware to release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: OpenWrt_${{ env.FILE_DATE }}
        files: ${{ env.PACKAGED_OUTPUTPATH }}/*.img.gz
        body: |
          固件版本: ImmortalWrt ${{ env.FW_VERSION }}
          首次使用建议全新刷写
          * 基本信息
          IP: 192.168.5.3
          账户: root
          密码: password

    - name: Delete old releases
      uses: mgz0227/delete-older-releases@v0.3.4
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        keep_latest: 3
        delete_tags: true
